<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="medilens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#medilens-grad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Medical HeartPulse Vector Icon -->
  <g filter="url(#shadow)">
    <!-- Heart Outline -->
    <path 
      d="M50 36.5c3.2-3.1 6-6.8 6-11.5A11.5 11.5 0 0 0 44.5 13.5c-3.7 0-6.3 1.1-9.5 4.3C31.8 14.6 29.2 13.5 25.5 13.5A11.5 11.5 0 0 0 14 25c0 4.7 2.8 8.4 6 11.5l15 15Z" 
      stroke="#ffffff" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="#ffffff"
      fill-opacity="0.08"
    />
    
    <!-- Cardiogram ECG Pulse Line -->
    <path 
      d="M16 32h11l1.5-2.5 3.5 8 3.5-12 3 6.5h9.5" 
      stroke="#ffffff" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
